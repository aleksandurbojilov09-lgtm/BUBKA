name: BUBKA release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful full CI run for the exact main commit
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: choice
        options: [testing]
        default: testing
permissions:
  contents: read
  actions: read
concurrency:
  group: bubka-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
      build: ${{ steps.verify.outputs.build }}
      selection: ${{ steps.verify.outputs.selection }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          selection=$(python3 scripts/release_provenance.py resolve --run-id "$RUN_ID")
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          version=$(python3 scripts/version.py version)
          build=$(python3 scripts/version.py build)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
  sign:
    needs: validate
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
      artifact_digest: ${{ steps.signed.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    environment: android-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Retrieve verified CI assets
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          SELECTION: ${{ needs.validate.outputs.selection }}
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD: ${{ needs.validate.outputs.build }}
        run: |
          set -euo pipefail
          python3 scripts/release_provenance.py download --run-id "$RUN_ID" --selection "$SELECTION"
          mkdir dist
          cp "ios-input/BUBKA-$VERSION+$BUILD-unsigned.ipa" "dist/BUBKA-$VERSION-$BUILD-unsigned.ipa"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Sign approved APK
        env:
          BUBKA_KEYSTORE_BASE64: ${{ secrets.BUBKA_KEYSTORE_BASE64 }}
          BUBKA_KEYSTORE_PASSWORD: ${{ secrets.BUBKA_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD: ${{ needs.validate.outputs.build }}
        run: bash scripts/sign-release-apk.sh "android-input/BUBKA-$VERSION+$BUILD-unsigned.apk" "dist/BUBKA-$VERSION-$BUILD.apk"
      - env:
          CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/create-update-manifest.py dist "$CHANNEL"
      - id: signed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-release-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    needs: [validate, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Publish new release only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.sign.outputs.artifact_digest }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/signed-artifact.json
          jq -e --arg sha "$GITHUB_SHA" --arg name "verified-release-attempt-$GITHUB_RUN_ATTEMPT" --arg digest "sha256:$ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" '.name == $name and .digest == $digest and .expired == false and .workflow_run.head_sha == $sha and .workflow_run.head_branch == "main" and (.workflow_run.id|tostring) == $run' /tmp/signed-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/signed-release.zip
          printf '%s  %s\n' "$ARTIFACT_DIGEST" /tmp/signed-release.zip | sha256sum -c -
          mkdir dist
          python3 - <<'PY_ZIP'
          import zipfile
          from pathlib import Path
          import subprocess
          version=subprocess.check_output(['python3','scripts/version.py','version'],text=True).strip()
          build=subprocess.check_output(['python3','scripts/version.py','build'],text=True).strip()
          expected={f'BUBKA-{version}-{build}.apk',f'BUBKA-{version}-{build}-unsigned.ipa','SHA256SUMS.txt','update-manifest.json'}
          with zipfile.ZipFile('/tmp/signed-release.zip') as z:
              assert len(z.namelist())==len(expected) and set(z.namelist())==expected
              for n in expected:
                  with z.open(n) as src, (Path('dist')/n).open('xb') as dst:
                      import shutil
                      shutil.copyfileobj(src,dst)
          PY_ZIP
          (cd dist && sha256sum -c SHA256SUMS.txt)
          tag="v$VERSION"
          python3 scripts/release_provenance.py prepublish
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" > /tmp/tag-refs.json
          jq -e --arg ref "refs/tags/$tag" 'all(.[]; .ref != $ref)' /tmp/tag-refs.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          args=()
          if [[ "$CHANNEL" == testing ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BUBKA $VERSION" --notes "Technical installation and update validation. iOS IPA requires SideStore signing." "${args[@]}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > /tmp/published-release.json
          jq -e --slurpfile manifest dist/update-manifest.json '
            . as $release | ($release.draft == false and $release.prerelease == true and
            all($manifest[0].assets[];
              . as $expected | any($release.assets[];
                .name == $expected.filename and .size == $expected.size_bytes and
                .browser_download_url == $expected.download_url)))
          ' /tmp/published-release.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
