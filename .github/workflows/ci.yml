name: BUBKA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubka-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      common: ${{ steps.plan.outputs.common }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: plan
        run: python3 scripts/ci_classify.py
  docs:
    runs-on: ubuntu-24.04
    needs: classify
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/test_ci_classify.py
      - run: python3 scripts/test_ci_gate.py
      - run: python3 scripts/check_git_diff.py
  checks:
    name: Common checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [classify, docs]
    if: needs.classify.outputs.common == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cache verified Flutter SDK archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/bubka-sdk-archive
          key: bubka-sdk-${{ runner.os }}-${{ runner.arch }}-3.50.1-ae9b586-v1
      - run: bash scripts/ci_flutter.sh
      - name: Cache pub hosted dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: bubka-pub-${{ runner.os }}-${{ runner.arch }}-3.50.1-${{ hashFiles('pubspec.lock') }}-v1
      - run: flutter pub get --enforce-lockfile
      - run: python3 scripts/version.py check
      - run: python3 scripts/check_architecture.py
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: dart run build_runner build
      - run: dart run drift_dev make-migrations
      - run: dart format lib test integration_test
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - run: flutter test --no-pub
  android:
    name: Android unsigned release APK
    needs: [classify, docs, checks]
    if: needs.classify.outputs.android == 'true' && needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cache verified Flutter SDK archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/bubka-sdk-archive
          key: bubka-sdk-${{ runner.os }}-${{ runner.arch }}-3.50.1-ae9b586-v1
      - run: bash scripts/ci_flutter.sh
      - name: Cache pub hosted dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: bubka-pub-${{ runner.os }}-${{ runner.arch }}-3.50.1-${{ hashFiles('pubspec.lock') }}-v1
      - run: flutter pub get --enforce-lockfile
      - name: Cache Gradle dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: bubka-gradle-${{ runner.os }}-${{ runner.arch }}-3.50.1-jdk17-${{ hashFiles('android/**/*.gradle*','android/gradle/wrapper/gradle-wrapper.properties','android/gradle.properties','pubspec.lock') }}-v1
      - name: Prepare Android SDK and JDK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: flutter build apk --release --no-pub
      - id: artifact
        run: |
          set -euo pipefail
          bash scripts/verify-release-apk.sh build/app/outputs/flutter-apk/app-release.apk unsigned
          version=$(python3 scripts/version.py version)
          build=$(python3 scripts/version.py build)
          name="BUBKA-${version}+${build}-unsigned.apk"
          mkdir -p build/bubka-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "build/bubka-artifacts/$name"
          (cd build/bubka-artifacts && sha256sum "$name" > SHA256SUMS.txt)
          echo "name=BUBKA-${version}-${build}-android-unsigned" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/bubka-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  ios:
    name: iOS unsigned IPA
    needs: [classify, docs, checks]
    if: needs.classify.outputs.ios == 'true' && needs.checks.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Xcode
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild -version -sdk iphoneos
      - name: Cache verified Flutter SDK archive
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/bubka-sdk-archive
          key: bubka-sdk-${{ runner.os }}-${{ runner.arch }}-3.50.1-ae9b586-v1
      - run: bash scripts/ci_flutter.sh
      - name: Cache pub hosted dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: bubka-pub-${{ runner.os }}-${{ runner.arch }}-3.50.1-${{ hashFiles('pubspec.lock') }}-v1
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --no-pub
      - id: artifact
        run: |
          set -euo pipefail
          bash scripts/package-ios-ipa.sh
          version=$(python3 scripts/version.py version)
          build=$(python3 scripts/version.py build)
          echo "name=BUBKA-${version}-${build}-ios-unsigned" >> "$GITHUB_OUTPUT"
          { sw_vers; uname -m; xcodebuild -version; flutter --version; } > build/bubka-ios-artifacts/ENVIRONMENT.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/bubka-ios-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  gate:
    name: BUBKA CI gate
    if: always()
    needs: [classify, docs, checks, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 scripts/ci_gate.py
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DOCS: ${{ needs.docs.result }}
          COMMON_REQUIRED: ${{ needs.classify.outputs.common }}
          COMMON_RESULT: ${{ needs.checks.result }}
          ANDROID_REQUIRED: ${{ needs.classify.outputs.android }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_REQUIRED: ${{ needs.classify.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
