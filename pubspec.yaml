    - assets/design/cockpit/icons/deadlines.png
    - assets/design/cockpit/icons/documents.png
    - assets/design/cockpit/icons/fuel.png
    - assets/design/cockpit/icons/garage.png
    - assets/design/cockpit/icons/home.png
    - assets/design/cockpit/icons/plus.png
    - assets/design/cockpit/icons/service.png
    - assets/design/cockpit/icons/settings.png
    - assets/design/cockpit/icons/stats.png
    - assets/design/cockpit/ignition/asphalt.png
    - assets/design/cockpit/ignition/beam_left.png
    - assets/design/cockpit/ignition/beam_right.png
