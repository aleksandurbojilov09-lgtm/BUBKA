name: garage
description: Personal digital garage for Android and iOS.
publish_to: 'none'
version: 0.4.1+7

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.2
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  pub_semver: ^2.2.1
  timezone: ^0.11.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
